<!DOCTYPE html>
<!--/* Khung trang dùng chung: <html th:replace="~{layout :: layout(~{::title}, ~{::main})}"> */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:replace="${title}">LabTrack</title>
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-md bg-primary mb-4" data-bs-theme="dark">
	<div class="container">
		<a class="navbar-brand" th:href="@{/samples}">LabTrack</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
				aria-controls="main-nav" aria-expanded="false" aria-label="Mở menu">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="main-nav">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link" th:href="@{/samples}">Danh sách mẫu</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/samples/new}">Đăng ký mẫu</a></li>
			</ul>
		</div>
	</div>
</nav>
<div class="container pb-4">
	<div th:if="${message}" class="alert alert-success" role="status" th:text="${message}">Thông báo</div>
	<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Lỗi</div>
	<main th:replace="${content}"></main>
</div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
