<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
	<title>Đăng ký mẫu · LabTrack</title>
</head>
<body>
<main>
	<h1 class="h3 mb-3">Đăng ký mẫu</h1>

	<!--/* novalidate: mọi thông báo lỗi đến từ server, bằng tiếng Việt, theo BR-02 */-->
	<form class="card card-body" th:action="@{/samples}" th:object="${sampleForm}" method="post" novalidate>
		<div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
			<p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi chung</p>
		</div>

		<div class="mb-3">
			<label for="productName" class="form-label">Tên sản phẩm</label>
			<input type="text" id="productName" class="form-control" th:field="*{productName}"
				   th:errorclass="is-invalid" maxlength="200">
			<div class="invalid-feedback" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></div>
		</div>

		<div class="mb-3">
			<label for="batchNo" class="form-label">Số lô</label>
			<input type="text" id="batchNo" class="form-control" th:field="*{batchNo}"
				   th:errorclass="is-invalid" maxlength="50" aria-describedby="batchNoHelp">
			<div id="batchNoHelp" class="form-text">Ví dụ: PA-2601. Chỉ gồm chữ không dấu, số, dấu - và /.</div>
			<div class="invalid-feedback" th:if="${#fields.hasErrors('batchNo')}" th:errors="*{batchNo}"></div>
		</div>

		<div class="mb-3">
			<label for="sampleType" class="form-label">Loại mẫu</label>
			<select id="sampleType" class="form-select" th:field="*{sampleType}" th:errorclass="is-invalid">
				<option value="">-- Chọn loại mẫu --</option>
				<option th:each="t : ${sampleTypes}" th:value="${t}" th:text="${t.label}">Thành phẩm</option>
			</select>
			<div class="invalid-feedback" th:if="${#fields.hasErrors('sampleType')}" th:errors="*{sampleType}"></div>
		</div>

		<div class="row">
			<div class="col-md-6 mb-3">
				<label for="receivedAt" class="form-label">Thời điểm nhận</label>
				<input type="datetime-local" id="receivedAt" class="form-control" th:field="*{receivedAt}"
					   th:errorclass="is-invalid">
				<div class="invalid-feedback" th:if="${#fields.hasErrors('receivedAt')}" th:errors="*{receivedAt}"></div>
			</div>
			<div class="col-md-6 mb-3">
				<label for="dueDate" class="form-label">Hạn trả kết quả</label>
				<input type="date" id="dueDate" class="form-control" th:field="*{dueDate}" th:errorclass="is-invalid">
				<div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
			</div>
		</div>

		<div class="d-flex flex-wrap gap-2">
			<button type="submit" class="btn btn-primary">Đăng ký</button>
			<a class="btn btn-outline-secondary" th:href="@{/samples}">Hủy</a>
		</div>
	</form>
</main>
</body>
</html>
