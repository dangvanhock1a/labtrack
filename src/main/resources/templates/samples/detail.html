<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${sample.code})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
	<div th:replace="~{fragments/layout :: flash}"></div>

	<h1 class="h3 mb-3" th:text="|Mẫu ${sample.code}|"></h1>

	<dl class="row">
		<dt class="col-sm-3">Mã mẫu</dt>
		<dd class="col-sm-9" th:text="${sample.code}"></dd>

		<dt class="col-sm-3">Sản phẩm</dt>
		<dd class="col-sm-9" th:text="${sample.productName}"></dd>

		<dt class="col-sm-3">Số lô</dt>
		<dd class="col-sm-9" th:text="${sample.batchNo}"></dd>

		<dt class="col-sm-3">Loại mẫu</dt>
		<dd class="col-sm-9" th:text="${sample.sampleType.label}"></dd>

		<dt class="col-sm-3">Trạng thái</dt>
		<dd class="col-sm-9">
			<span th:replace="~{fragments/layout :: statusBadge(${sample.status})}"></span>
		</dd>

		<dt class="col-sm-3">Thời điểm nhận</dt>
		<dd class="col-sm-9" th:text="${#temporals.format(sample.receivedAt, 'dd/MM/yyyy HH:mm')}"></dd>

		<dt class="col-sm-3">Hạn trả kết quả</dt>
		<dd class="col-sm-9" th:text="${#temporals.format(sample.dueDate, 'dd/MM/yyyy')}"></dd>

		<dt class="col-sm-3">Người đăng ký</dt>
		<dd class="col-sm-9" th:text="${sample.createdBy}"></dd>
	</dl>

	<!-- BR-04: cũ trước mới sau; giờ đã được tầng nghiệp vụ đổi về múi giờ ứng dụng. -->
	<section class="mb-4" aria-labelledby="historyTitle">
		<h2 class="h5" id="historyTitle">Lịch sử trạng thái</h2>
		<div class="table-responsive">
			<table class="table table-sm align-middle">
				<thead>
				<tr>
					<th scope="col">Thời điểm</th>
					<th scope="col">Người thực hiện</th>
					<th scope="col">Từ → đến</th>
					<th scope="col">Lý do</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="h : ${history}">
					<td class="text-nowrap" th:text="${#temporals.format(h.changedAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
					<td th:text="${h.changedBy}"></td>
					<td class="text-nowrap">
						<!-- th:replace chạy trước th:if nếu đặt cùng thẻ, nên điều kiện nằm ở th:block bọc ngoài. -->
						<th:block th:if="${h.fromStatus == null}">Tạo mới</th:block>
						<th:block th:unless="${h.fromStatus == null}">
							<span th:replace="~{fragments/layout :: statusBadge(${h.fromStatus})}"></span>
						</th:block>
						→
						<span th:replace="~{fragments/layout :: statusBadge(${h.toStatus})}"></span>
					</td>
					<td th:text="${h.reason}"></td>
				</tr>
				<tr th:if="${#lists.isEmpty(history)}">
					<td colspan="4" class="text-body-secondary">Chưa có lịch sử</td>
				</tr>
				</tbody>
			</table>
		</div>
	</section>

	<!-- BR-12: nút hiện khi vừa đúng trạng thái vừa đúng vai trò (ma trận trong SecurityConfig). Ẩn nút chỉ
		 cho dễ dùng, gửi thẳng POST vẫn bị SecurityConfig chặn. sec:authorize và th:if đều chỉ bỏ thẻ khi
		 điều kiện sai, nên đặt chung một thẻ được, thứ tự xử lý không đổi kết quả. -->
	<div class="d-flex flex-wrap gap-2">
		<!-- BR-03: chỉ mẫu Đã tiếp nhận mới nhận vào kiểm nghiệm được. -->
		<form th:if="${sample.status.name() == 'RECEIVED'}" sec:authorize="hasAnyRole('ANALYST', 'REVIEWER')"
			  method="post" th:action="@{/samples/{id}/start(id=${sample.id})}">
			<button type="submit" class="btn btn-primary">Nhận kiểm nghiệm</button>
		</form>

		<!-- BR-05: mẫu đã kết thúc (Hoàn thành, Đã hủy) thì không hủy được nữa. -->
		<button type="button" class="btn btn-outline-danger" th:unless="${sample.status.terminal}"
				sec:authorize="hasAnyRole('RECEPTIONIST', 'REVIEWER')"
				data-bs-toggle="modal" data-bs-target="#cancelModal">Hủy mẫu</button>

		<a class="btn btn-outline-secondary" th:href="@{/samples}">Quay lại danh sách</a>
	</div>

	<div class="modal fade" id="cancelModal" tabindex="-1" aria-labelledby="cancelModalTitle" aria-hidden="true"
		 th:unless="${sample.status.terminal}" sec:authorize="hasAnyRole('RECEPTIONIST', 'REVIEWER')">
		<div class="modal-dialog modal-dialog-centered">
			<form class="modal-content" method="post" th:action="@{/samples/{id}/cancel(id=${sample.id})}">
				<div class="modal-header">
					<h2 class="modal-title h5" id="cancelModalTitle" th:text="|Hủy mẫu ${sample.code}|"></h2>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
				</div>
				<div class="modal-body">
					<label for="reason" class="form-label">Lý do hủy (5–500 ký tự)</label>
					<textarea class="form-control" id="reason" name="reason" rows="3"
							  minlength="5" maxlength="500" required></textarea>
					<div class="form-text">Lý do được lưu cùng lần đổi trạng thái và không sửa được sau đó.</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
					<button type="submit" class="btn btn-danger">Hủy mẫu</button>
				</div>
			</form>
		</div>
	</div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
	// Thuộc tính autofocus không có tác dụng trong modal vì lúc tải trang ô nhập còn đang ẩn.
	document.getElementById('cancelModal')?.addEventListener('shown.bs.modal', function () {
		document.getElementById('reason').focus();
	});
</script>
</body>
</html>
